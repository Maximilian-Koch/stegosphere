[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stegosphere"  # Replace with your package name
version = "1.3"
description = "A flexible steganography and steganalysis library supporting various file types, including encryption and compression"
readme = "README.md"
requires-python = ">=3.6"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Maximilian Koch"}
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Topic :: Communications",
    "Topic :: Communications :: File Sharing",
    "Topic :: Multimedia",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Security",
    "Topic :: Security :: Cryptography"
]
dependencies = [
    "numpy",
    "lazy-loader"
]

[project.optional-depenencies]
complete = [
    "pillow",
    "opencv-python",
    "cryptography",
    "soundfile",
    "matplotlib",
    "fonttools",
    "scipy"
]


[project.urls]
"Source" = "https://github.com/Maximilian-Koch/stegosphere"
"Docs" = "https://maximilian-koch.github.io/stegosphere/"